[package]
name = "frost-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
bitcoin = "0.32.6"
frost-secp256k1-tr = "3.0.0"
hex = "0.4"
hmac = "0.12"
k256 = "0.13"
psbt = { git = "https://github.com/macgyver13/spdk.git", branch = "musig2-working" }
psbt-v2 = { git = "https://gitea.bitcoin.ninja/macgyver/rust-psbt.git", branch = "musig2-working", features = ["miniscript", "musig2", "silent-payments"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
rfd = "0.15.4"
secp256k1 = { version = "0.29", features = ["rand", "global-context", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
silentpayments = { git = "https://github.com/macgyver13/spdk.git", branch = "musig2-working" }
slint = "1.16.1"
thiserror = "1.0"

[build-dependencies]
slint-build = "1.16.1"

[[bin]]
name = "frost-coordinator"
path = "src/bin/coordinator.rs"

[[bin]]
name = "frost-companion"
path = "src/bin/companion.rs"
