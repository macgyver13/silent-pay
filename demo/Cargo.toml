[package]
name = "sp-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false

[dependencies]
anyhow = "1.0"
bip39 = "2.0"
bitcoin = "0.32.6"
bitcoincore-rpc = "0.19.0"
hex = "0.4"
hmac = "0.12"
musig2 = { version = "0.3.1", features = ["secp256k1"] }
rust-dleq = { git = "https://github.com/Sosthene00/rust-dleq.git", rev = "097644a14d87c454e9bd9895de2e60992ff1ba93" }
psbt = { workspace = true }
psbt-v2 = { workspace = true }
secp256k1 = { version = "0.29", features = ["rand", "global-context", "serde"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
silent-pay = { path = "..", default-features = false }
silentpayments = { workspace = true }
toml = "0.9.12"

[[bin]]
name = "finalize"
path = "src/bin/finalize_payroll.rs"

[[bin]]
name = "payroll"
path = "src/bin/build_payroll.rs"

[[bin]]
name = "scan_recipients"
path = "src/bin/scan_recipients.rs"

[[bin]]
name = "verify_receipt"
path = "src/bin/verify_receipt.rs"

[[bin]]
name = "gen_demo_recipients"
path = "src/bin/gen_demo_recipients.rs"

[[bin]]
name = "fund_treasury"
path = "src/bin/fund_treasury.rs"

[[bin]]
name = "build_round1"
path = "src/bin/build_round1.rs"

[[bin]]
name = "broadcast_final"
path = "src/bin/broadcast_final.rs"

[[bin]]
name = "verify_onchain"
path = "src/bin/verify_onchain.rs"

[[bin]]
name = "treasury_address"
path = "src/bin/treasury_address.rs"
